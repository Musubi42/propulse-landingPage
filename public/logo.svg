<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Propulse Logo - Pen & Journey Metaphor -->
  <rect width="512" height="512" fill="#FAF6F0"/>

  <!-- Pen stroke forming upward arrow/trajectory -->
  <path d="M 150 380 Q 200 300 256 220 T 362 132"
        stroke="#1B3A52"
        stroke-width="24"
        stroke-linecap="round"
        fill="none"/>

  <!-- Arrow head -->
  <path d="M 362 132 L 340 150 M 362 132 L 350 160"
        stroke="#D97642"
        stroke-width="18"
        stroke-linecap="round"
        fill="none"/>

  <!-- Dots representing journey milestones -->
  <circle cx="180" cy="350" r="12" fill="#4A6B52"/>
  <circle cx="220" cy="280" r="12" fill="#4A6B52"/>
  <circle cx="280" cy="200" r="12" fill="#D97642"/>
  <circle cx="340" cy="160" r="12" fill="#D97642"/>

  <!-- Letter P stylized -->
  <text x="256" y="460" font-family="serif" font-size="140" font-weight="bold" fill="#1B3A52" text-anchor="middle">P</text>
</svg>
